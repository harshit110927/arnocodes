services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dbname}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${BACKEND_ENVIRONMENT:-development}
    depends_on:
      - postgres
      - redis
    networks:
      - arnocodes-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${FRONTEND_NODE_ENV:-production}
    networks:
      - arnocodes-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=${AI_PORT:-5000}
      - ENVIRONMENT=${AI_ENVIRONMENT:-development}
    networks:
      - arnocodes-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-dbname}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - arnocodes-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - arnocodes-network

volumes:
  postgres-data:
  redis-data:

networks:
  arnocodes-network:
    driver: bridge
